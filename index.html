<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penny Garden Budget Planner</title>
<meta name="description" content="Penny Garden: an interactive budget planner with paycheck budgeting, bills, savings goals, debt payoff and more.">
<meta name="theme-color" content="#F6F1E7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Penny Garden">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='23' r='14' fill='%23E2AE3C'/%3E%3Cpath d='M20 9c0-4 3-6.5 7-6.5 0 4-3 6.5-7 6.5z' fill='%232E7D5B'/%3E%3Cpath d='M20 9c0-3-2.2-5-5.5-5 0 3 2.2 5 5.5 5z' fill='%231F5A43'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F6F1E7;--paper:#FBF8F1;--surface:#FFFFFF;--surface2:#F2ECDF;--ink:#1E2B24;--muted:#6B7A70;--line:#E4DCCB;
  --pri:#1F5A43;--pri2:#2E7D5B;--pri-soft:#DCEBDF;--pri-ink:#FFFFFF;
  --acc:#E8735A;--acc-soft:#FBE3DC;--gold:#E2AE3C;--gold-soft:#FBF0D3;
  --good:#2E8B57;--bad:#D2513F;--warn:#D99A1E;
  --sh:0 1px 2px rgba(30,43,36,.05),0 6px 18px rgba(30,43,36,.06);
  --r:18px;--r2:12px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
[data-theme=blush]{--bg:#FBF1F0;--paper:#FFF8F7;--surface2:#F8E7E4;--line:#F0D9D4;--pri:#B5466B;--pri2:#D0607F;--pri-soft:#F8DDE5;--acc:#5E8C7A;--acc-soft:#DCEDE6;--gold:#E0A43A}
[data-theme=ocean]{--bg:#EEF3F6;--paper:#F7FAFC;--surface2:#E3ECF1;--line:#D5E1E8;--pri:#1D4E6E;--pri2:#2B7A9B;--pri-soft:#D8E8F1;--acc:#F08A5D;--acc-soft:#FCE5DA;--gold:#E8B54A}
[data-theme=sunset]{--bg:#FAF0E6;--paper:#FFF8F0;--surface2:#F6E4D2;--line:#EED8C2;--pri:#B5532E;--pri2:#D46D40;--pri-soft:#F6DFD1;--acc:#2F6F73;--acc-soft:#D6E9EA;--gold:#E3A22F}
[data-theme=lavender]{--bg:#F3F0F9;--paper:#FAF8FD;--surface2:#E9E3F4;--line:#DDD5EC;--pri:#5B4A9B;--pri2:#7A66C2;--pri-soft:#E4DDF5;--acc:#E07A8B;--acc-soft:#F9DFE4;--gold:#E4B04A}
[data-theme=mono]{--bg:#F2F0EC;--paper:#FAF9F6;--surface2:#E9E6E0;--line:#DDD8CF;--pri:#2B2B2B;--pri2:#4A4A4A;--pri-soft:#E2DFD8;--acc:#C8963E;--acc-soft:#F3E8D3;--gold:#C8963E}
[data-dark=true]{--bg:#141A17;--paper:#18201C;--surface:#1E2723;--surface2:#26312C;--ink:#ECF1EC;--muted:#9CAAA1;--line:#2F3B35;--pri-soft:rgba(120,200,160,.14);--acc-soft:rgba(232,115,90,.16);--gold-soft:rgba(226,174,60,.16);--sh:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25)}
[data-dark=true][data-theme=garden],[data-dark=true]:not([data-theme]){--pri:#5DBB8A;--pri2:#7CCDA2;--pri-ink:#0E1A14}
[data-dark=true][data-theme=blush]{--pri:#E58AA6;--pri2:#F0A3BA;--pri-ink:#2A0F18}
[data-dark=true][data-theme=ocean]{--pri:#5FB3D6;--pri2:#82C6E2;--pri-ink:#0B1C26}
[data-dark=true][data-theme=sunset]{--pri:#EE8C5E;--pri2:#F4A57F;--pri-ink:#2A1208}
[data-dark=true][data-theme=lavender]{--pri:#A894EC;--pri2:#BEAEF2;--pri-ink:#1A1233}
[data-dark=true][data-theme=mono]{--pri:#E8E4DC;--pri2:#FFFFFF;--pri-ink:#151515}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--serif);font-weight:700;letter-spacing:-.01em}
.num,.money{font-variant-numeric:tabular-nums}
a{color:var(--pri)}

/* layout */
#app{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:var(--paper);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand b{font-family:var(--serif);font-size:19px;line-height:1.05;display:block}
.brand small{color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.nav-btn{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;border:0;background:none;cursor:pointer;text-align:left;color:var(--muted);font-weight:550;width:100%}
.nav-btn svg{width:19px;height:19px;flex:none}
.nav-btn:hover{background:var(--surface2);color:var(--ink)}
.nav-btn.on{background:var(--pri);color:var(--pri-ink)}
.nav-sep{height:1px;background:var(--line);margin:8px 10px}
.side-foot{margin-top:auto;padding:12px 8px 0;font-size:12px;color:var(--muted)}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:14px 26px;border-bottom:1px solid transparent}
.top h1{font-size:25px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.period{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.period span{min-width:132px;text-align:center;font-weight:650;font-size:14px;white-space:nowrap}
.ibtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;flex:none}
.period .ibtn{border:0;width:30px;height:30px}
.ibtn:hover{background:var(--surface2)}
.ibtn svg{width:18px;height:18px}
#page{padding:8px 26px 40px;max-width:1360px;width:100%}

/* bits */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 15px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn svg{width:16px;height:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:11.5px}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--surface2);font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.g{background:var(--pri-soft);color:var(--pri)}
.pill.r{background:var(--acc-soft);color:var(--bad)}
.pill.y{background:var(--gold-soft);color:#9a6b07}
[data-dark=true] .pill.y{color:var(--gold)}
.seg{display:inline-flex;background:var(--surface2);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 13px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted);font-size:13.5px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);min-width:0}
.card h3{font-size:17.5px;display:flex;align-items:center;gap:8px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{flex:1;min-width:0}
.kpi{position:relative;overflow:hidden}
.kpi .lab{font-size:12.5px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .val{font-family:var(--serif);font-size:29px;font-weight:700;margin:6px 0 2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .ico{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--surface2)}
.kpi.hero{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.kpi.hero .lab,.kpi.hero .muted{color:inherit;opacity:.8}
.kpi.hero .ico{background:rgba(255,255,255,.16)}
.bar{height:9px;background:var(--surface2);border-radius:99px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--pri)}
.bar.thick{height:14px}
.hero .bar{background:rgba(255,255,255,.22)}.hero .bar>i{background:#fff}
.empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:14px}
.empty .e{font-size:30px;display:block;margin-bottom:4px}
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);margin-bottom:16px;flex-wrap:wrap}
.banner.g{background:var(--pri-soft);border-color:color-mix(in srgb,var(--pri) 30%,transparent)}
.banner .t{flex:1;min-width:200px}
.hello{margin:6px 0 16px}
.hello h2{font-size:27px}
.hello p{margin:3px 0 0;color:var(--muted)}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px dashed var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .em{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none;background:var(--surface2)}
.li .mid{flex:1;min-width:0}
.li .mid b{display:block;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .mid span{font-size:12.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.li.click{cursor:pointer;border-radius:10px}
.li.click:hover{background:var(--surface2)}
.datehdr{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:14px 2px 4px}

/* budget rows */
.brow{display:grid;grid-template-columns:minmax(150px,1.4fr) minmax(90px,.7fr) 2fr minmax(90px,.7fr);gap:14px;align-items:center;padding:10px 4px;border-bottom:1px dashed var(--line)}
.brow:last-child{border-bottom:0}
.brow .nm{display:flex;align-items:center;gap:10px;min-width:0;font-weight:600}
.brow .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow input{width:100%;text-align:right}
.ghead{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:16px 4px 6px;display:flex;gap:8px}
.envs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.env{position:relative;border-radius:14px;background:var(--surface2);padding:14px;overflow:hidden;min-height:132px;border:1px solid var(--line)}
.env:before{content:"";position:absolute;left:0;right:0;top:0;height:46px;background:linear-gradient(160deg,transparent 49%,var(--line) 50%,transparent 51%),linear-gradient(20deg,transparent 49%,var(--line) 50%,transparent 51%);opacity:.9}
.env .fill{position:absolute;left:0;right:0;bottom:0;opacity:.22}
.env .in{position:relative}
.env .e1{font-size:22px}
.env b{display:block;margin-top:24px;font-size:14px}
.env .left{font-family:var(--serif);font-size:21px;font-weight:700}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field label{font-size:12.5px;font-weight:650;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--paper);outline:none;min-width:0}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
.inp.sm{padding:7px 10px;border-radius:9px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:550}
.chk input{width:18px;height:18px;accent-color:var(--pri)}
.typeseg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.typeseg button{padding:10px;border-radius:11px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-weight:650}
.typeseg button.on.exp{background:var(--acc-soft);border-color:var(--acc);color:var(--bad)}
.typeseg button.on.inc{background:var(--pri-soft);border-color:var(--pri);color:var(--pri)}
.amount-big{font-family:var(--serif);font-size:30px!important;font-weight:700;text-align:center}

/* modal */
#modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(20,26,23,.45);padding:20px}
#modal.on{display:flex}
.mbox{background:var(--surface);border-radius:22px;width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .18s ease}
.mbox.wide{max-width:760px}
.mhead{display:flex;align-items:center;gap:10px;padding:18px 20px 8px}
.mhead h3{flex:1;font-size:20px}
.mbody{padding:8px 20px 6px;overflow:auto}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px 18px;flex-wrap:wrap}
.mfoot .left{margin-right:auto}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:300}

/* mobile nav */
.bnav{display:none}
.fab{position:fixed;right:26px;bottom:26px;z-index:40;width:58px;height:58px;border-radius:20px;border:0;background:var(--acc);color:#fff;box-shadow:0 10px 24px rgba(232,115,90,.4);display:grid;place-items:center;cursor:pointer}
.fab svg{width:26px;height:26px}
.sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sheet-grid button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:14px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-weight:600;font-size:13px}
.sheet-grid svg{width:22px;height:22px;color:var(--pri)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:11.5px;font-weight:700;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:2px}
.cal .d{min-height:84px;border-radius:12px;background:var(--paper);border:1px solid var(--line);padding:6px 7px;font-size:12px;cursor:pointer;position:relative;overflow:hidden;min-width:0}
.cal .d.out{opacity:.35;cursor:default}
.cal .d.today{outline:2px solid var(--pri);outline-offset:-1px}
.cal .d.sel{box-shadow:0 0 0 3px var(--pri-soft);border-color:var(--pri)}
.cal .d .n{font-weight:700}
.cal .d .ev{display:block;margin-top:3px;padding:1px 6px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--surface2)}
.cal .d .ev.paid{background:var(--pri-soft);color:var(--pri);text-decoration:line-through;text-decoration-thickness:1px}
.cal .d .ev.due{background:var(--acc-soft);color:var(--bad)}
.cal .d .ns{position:absolute;right:6px;top:4px;font-size:15px}
.cal .d .sum{position:absolute;left:7px;bottom:5px;font-weight:700;font-size:11.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}

/* challenges */
.chal{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.chal button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:11.5px;font-weight:700;padding:0;color:var(--muted);font-variant-numeric:tabular-nums}
.chal button.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}

.goal{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--paper);display:flex;flex-direction:column;gap:9px;min-width:0}
.goal .top2{display:flex;align-items:center;gap:10px}
.goal .e{font-size:24px;width:44px;height:44px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;flex:none}
.goal h4{font-family:var(--sans);font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.garden{width:100%;display:block;border-radius:14px}
.insight{display:flex;gap:11px;padding:10px 12px;border-radius:12px;background:var(--paper);border:1px solid var(--line);margin-bottom:8px;font-size:14px;align-items:flex-start}
.insight .i{font-size:18px;line-height:1.2}
.verdict{border-radius:16px;padding:18px;text-align:center}
.verdict .big{font-family:var(--serif);font-size:26px;font-weight:700}
.verdict.yes{background:var(--pri-soft);color:var(--pri)}
.verdict.maybe{background:var(--gold-soft);color:#93650a}
.verdict.no{background:var(--acc-soft);color:var(--bad)}
[data-dark=true] .verdict.maybe{color:var(--gold)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 8px;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.tbl td.r,.tbl th.r{text-align:right}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--sans);fill:var(--muted);font-size:11px}
.donutwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donutwrap svg{width:170px;height:170px;flex:none}
.dleg{flex:1;min-width:170px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.dleg div{display:flex;align-items:center;gap:8px}
.dleg i{width:10px;height:10px;border-radius:3px;flex:none}
.dleg span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dleg b{font-variant-numeric:tabular-nums}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:74px;border-radius:14px;border:2px solid var(--line);padding:6px;cursor:pointer;background:var(--paper);text-align:center;font-size:11.5px;font-weight:650}
.sw.on{border-color:var(--pri)}
.sw div{height:30px;border-radius:9px;margin-bottom:5px;display:flex;overflow:hidden}
.sw div i{flex:1}
.help h4{font-family:var(--sans);font-size:15px;margin:14px 0 4px}
.help p,.help li{color:var(--muted);margin:4px 0}
.help ul{padding-left:18px;margin:4px 0}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.step{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px}
.step b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--pri);color:var(--pri-ink);font-size:13px;margin-bottom:6px}

/* lock + onboarding */

<script>
'use strict';
/* ========== Penny Garden Budget Planner — core ========== */
const KEY='pennygarden_budget_v1';

/* ---------- dates ---------- */

const dim=ym=>{const [y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate()};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const dayDiff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const monthLong=ym=>MON[+ym.slice(5,7)-1]+' '+ym.slice(0,4);
const monthShort=ym=>MON[+ym.slice(5,7)-1].slice(0,3);
const niceDate=s=>{const d=pd(s);return d.toLocaleDateString(undefined,{day:'numeric',month:'short'})};
const niceDateY=s=>{const d=pd(s);return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})};
const weekday=s=>pd(s).toLocaleDateString(undefined,{weekday:'long'});

/* ---------- money ---------- */
const CURRENCIES=[['USD','US Dollar'],['EUR','Euro'],['GBP','British Pound'],['CAD','Canadian Dollar'],['AUD','Australian Dollar'],['NZD','New Zealand Dollar'],['INR','Indian Rupee'],['PKR','Pakistani Rupee'],['AED','UAE Dirham'],['SAR','Saudi Riyal'],['QAR','Qatari Riyal'],['ZAR','South African Rand'],['SGD','Singapore Dollar'],['MYR','Malaysian Ringgit'],['PHP','Philippine Peso'],['NGN','Nigerian Naira'],['KES','Kenyan Shilling'],['JPY','Japanese Yen'],['CHF','Swiss Franc'],['SEK','Swedish Krona'],['NOK','Norwegian Krone'],['DKK','Danish Krone'],['PLN','Polish Zloty'],['MXN','Mexican Peso'],['BRL','Brazilian Real'],['TRY','Turkish Lira'],['BDT','Bangladeshi Taka'],['EGP','Egyptian Pound']];

  return _nf[k].format(+n||0);
}
const m0=n=>money(Math.round(n),0);
const curSymbol=()=>{try{return (0).toLocaleString(undefined,{style:'currency',currency:S.settings.currency,minimumFractionDigits:0}).replace(/[\d\s.,]/g,'')}catch(e){return '$'}};

/* ---------- state ---------- */
const DEFAULT_CATS=[
 ['Salary','💼','#2E7D5B','income','income',0],['Side hustle','✨','#7A66C2','income','income',0],['Freelance','🧑‍💻','#2B7A9B','income','income',0],['Other income','🎉','#E2AE3C','income','income',0],
 ['Housing','🏠','#1F5A43','needs','expense',1400],['Utilities','💡','#E2AE3C','needs','expense',220],['Groceries','🛒','#5E9E6E','needs','expense',560],['Transport','🚗','#2B7A9B','needs','expense',300],['Insurance','🛡️','#5B6F9B','needs','expense',180],['Phone & Internet','📶','#4A9BB0','needs','expense',110],['Health','💊','#D2513F','needs','expense',80],['Kids & Family','🧸','#E07A8B','needs','expense',150],
 ['Eating out','🍔','#E8735A','wants','expense',220],['Shopping','🛍️','#C46BA0','wants','expense',180],['Fun & Hobbies','🎨','#9B7BD4','wants','expense',120],['Subscriptions','📺','#6C5BB0','wants','expense',60],['Gifts','🎁','#D46D40','wants','expense',80],['Personal care','💅','#E59AAE','wants','expense',60],['Other','📦','#8C8C7A','wants','expense',50],

];
const GROUPS={needs:'Needs',wants:'Wants',savings:'Savings',debt:'Debt payments',income:'Income'};
function freshState(){
  return {v:1,started:false,demo:false,
    settings:{name:'',currency:'USD',mode:'monthly',payday:addDays(todayISO(),-((new Date().getDay()+2)%14)),weekStart:1,theme:'garden',dark:false,members:['Me','Partner'],split:'50',pin:'',lastBackup:'',envelope:false,nwDebts:true},
    cats:DEFAULT_CATS.map(([name,emoji,color,group,kind,budget])=>({id:uid(),name,emoji,color,group,kind,budget,pbudget:Math.round(budget*12/26)})),
    incomePlan:[],tx:[],bills:[],subs:[],goals:[],challenges:[],debts:[],accounts:[],nospend:[]};

  try{const raw=localStorage.getItem(KEY);if(raw){S=Object.assign(freshState(),JSON.parse(raw));S.settings=Object.assign(freshState().settings,S.settings)}}
  catch(e){if(MEM)S=MEM}
}

/* ---------- lookups ---------- */
const cat=id=>S.cats.find(c=>c.id===id)||{id:'',name:'Uncategorised',emoji:'❔',color:'#999',group:'wants',kind:'expense',budget:0};
const catByName=n=>S.cats.find(c=>c.name.toLowerCase()===String(n).toLowerCase());
const expCats=()=>S.cats.filter(c=>c.kind==='expense');
const incCats=()=>S.cats.filter(c=>c.kind==='income');
const txIn=(a,b)=>S.tx.filter(t=>t.date>=a&&t.date<=b);
const txMonth=ym=>S.tx.filter(t=>t.date.slice(0,7)===ym);
function monthStats(ym){
  const t=txMonth(ym);return statsOf(t);
}
function statsOf(t){
  const inc=sum(t.filter(x=>x.type==='income'),x=>x.amount);
  const by={needs:0,wants:0,savings:0,debt:0};const byCat={};
  t.filter(x=>x.type==='expense').forEach(x=>{const c=cat(x.cat);by[c.group]=(by[c.group]||0)+x.amount;byCat[x.cat]=(byCat[x.cat]||0)+x.amount});
  const spend=by.needs+by.wants;const out=spend+by.savings+by.debt;
  return {inc,spend,saved:by.savings,debt:by.debt,out,left:inc-out,by,byCat,count:t.length};
}
const goalSaved=g=>r2((+g.base||0)+sum(S.tx.filter(t=>t.goalId===g.id),t=>t.type==='expense'?t.amount:-t.amount));
const billPaid=(b,ym)=>S.tx.some(t=>t.billId===b.id&&t.date.slice(0,7)===ym);
function billDueIn(b,ym){ // returns iso date or null
  if(b.freq==='yearly'&&+b.month!==+ym.slice(5,7))return null;
  if(b.start&&ym<b.start.slice(0,7))return null;
  return ym+'-'+pad(Math.min(+b.day||1,dim(ym)));
}
const planIncome=()=>sum(S.incomePlan,p=>p.amount);
const totalBudget=()=>sum(expCats(),c=>c.budget);

/* ---------- biweekly cycles ---------- */
function cycleOf(dateIso){const k=Math.floor(dayDiff(S.settings.payday,dateIso)/14);return k}

/* ---------- ui helpers ---------- */
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600)}
let _modalSave=null;
function modal(title,body,{save:onSave,saveLabel='Save',wide=false,del:onDel,foot}={}){
  const m=$('#modal');
  m.innerHTML=`<div class="mbox ${wide?'wide':''}" role="dialog" aria-modal="true"><div class="mhead"><h3>${title}</h3><button class="ibtn" data-close aria-label="Close">${ico('x')}</button></div><div class="mbody">${body}</div>${foot!==undefined?foot:`<div class="mfoot">${onDel?`<button class="btn danger left" data-mdel>${ico('trash')}Delete</button>`:''}<button class="btn" data-close>Cancel</button>${onSave?`<button class="btn pri" data-msave>${saveLabel}</button>`:''}</div>`}</div>`;
  m.classList.add('on');
  _modalSave=onSave;
  m.querySelector('[data-msave]')?.addEventListener('click',()=>{if(onSave(m)!==false)closeModal()});
  m.querySelector('[data-mdel]')?.addEventListener('click',()=>{if(confirm('Delete this item?')){onDel();closeModal()}});
  m.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeModal));
  setTimeout(()=>{const f=m.querySelector('[autofocus]');if(f&&window.innerWidth>900)f.focus()},50);
  return m;
}
function closeModal(){$('#modal').classList.remove('on');$('#modal').innerHTML='';_modalSave=null}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').classList.contains('on'))closeModal();if(e.key==='Enter'&&_modalSave&&e.target.tagName==='INPUT'){const b=$('#modal [data-msave]');b&&b.click()}});
const val=(m,n)=>{const el=m.querySelector(`[name="${n}"]`);if(!el)return '';if(el.type==='checkbox')return el.checked;return el.value.trim()};
const numv=(m,n)=>{const v=parseFloat(String(val(m,n)).replace(/[^0-9.\-]/g,''));return isNaN(v)?0:v};
const catOptions=(sel,kind='expense')=>S.cats.filter(c=>!kind||c.kind===kind).map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${c.emoji} ${esc(c.name)}</option>`).join('');
const memberOptions=sel=>S.settings.members.map(m=>`<option ${m===sel?'selected':''}>${esc(m)}</option>`).join('')+`<option value="Shared" ${sel==='Shared'?'selected':''}>Shared</option>`;

/* ---------- confetti ---------- */
function confetti(){
  const c=$('#confetti');const x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#E8735A','#E2AE3C','#2E8B57','#7A66C2','#2B7A9B','#E07A8B'];
  const P=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[Math.random()*6|0],a:Math.random()*6,s:Math.random()*.3-.15}));
  let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=p.s;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(++f<150)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})();
}

/* ---------- charts (SVG) ---------- */
function donut(data,center='',sub=''){
  const tot=sum(data,d=>d.value);const R=60,C=2*Math.PI*R;let off=0;
  const segs=tot>0?data.filter(d=>d.value>0).map(d=>{const l=d.value/tot*C;const s=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="${d.color}" stroke-width="22" stroke-dasharray="${Math.max(l-1.5,0.1)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`;off+=l;return s}).join(''):'';
  return `<svg viewBox="0 0 160 160"><circle r="${R}" cx="80" cy="80" fill="none" stroke="var(--surface2)" stroke-width="22"/>${segs}<text x="80" y="78" text-anchor="middle" style="font:700 17px var(--serif);fill:var(--ink)">${esc(center)}</text><text x="80" y="97" text-anchor="middle" style="font:600 10.5px var(--sans);fill:var(--muted)">${esc(sub)}</text></svg>`;
}
function donutBlock(data,center,sub,fmt=m0){
  const tot=sum(data,d=>d.value);
  return `<div class="donutwrap">${donut(data,center,sub)}<div class="dleg">${data.filter(d=>d.value>0).slice(0,7).map(d=>`<div><i style="background:${d.color}"></i><span>${esc(d.label)}</span><b>${fmt(d.value)}</b><span class="muted tiny" style="flex:none;width:34px;text-align:right">${tot?Math.round(d.value/tot*100):0}%</span></div>`).join('')||'<div class="muted">No spending yet</div>'}</div></div>`;
}
function niceMax(v){if(v<=0)return 10;const x=v/4;const p=Math.pow(10,Math.floor(Math.log10(x)));const n=x/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=3?3:n<=4?4:n<=5?5:n<=6?6:n<=8?8:10)*p*4}
const short=n=>{const a=Math.abs(n);return (n<0?'-':'')+(a>=1e6?(a/1e6).toFixed(1).replace(/\.0$/,'')+'M':a>=1e3?(a/1e3).toFixed(a>=1e4?0:1).replace(/\.0$/,'')+'k':Math.round(a))};
function barChart(labels,series,h=230){ // series [{name,color,values}]
  const W=640,H=h,L=44,B=26,T=10;const n=labels.length;const max=niceMax(Math.max(1,...series.flatMap(s=>s.values)));
  const gw=(W-L-6)/n;const bw=Math.min(22,(gw-8)/series.length);
  let g='';for(let i=0;i<=4;i++){const y=T+(H-T-B)*(1-i/4);g+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="${i?'3 4':''}"/><text x="${L-8}" y="${y+4}" text-anchor="end">${short(max*i/4)}</text>`}
  labels.forEach((lb,i)=>{const x0=L+gw*i+(gw-bw*series.length)/2;series.forEach((s,j)=>{const v=s.values[i]||0;const bh=(H-T-B)*v/max;g+=`<rect x="${x0+j*bw+1}" y="${H-B-bh}" width="${bw-2}" height="${Math.max(bh,0)}" rx="4" fill="${s.color}"><title>${esc(s.name)} ${esc(lb)}: ${m0(v)}</title></rect>`});g+=`<text x="${L+gw*i+gw/2}" y="${H-8}" text-anchor="middle">${esc(lb)}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function lineChart(labels,series,h=230,opts={}){
  const W=640,H=h,L=48,B=26,T=12;const all=series.flatMap(s=>s.values).filter(v=>v!=null);
  let mn=Math.min(0,...all),mx=niceMax(Math.max(1,...all));if(mn<0)mn=-niceMax(-mn);
  const n=Math.max(labels.length,2);const X=i=>L+(W-L-10)*i/(n-1);const Y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  let g='';for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4;const y=Y(v);g+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="${i?'3 4':''}"/><text x="${L-8}" y="${y+4}" text-anchor="end">${short(v)}</text>`}
  const step=Math.ceil(labels.length/(opts.maxLabels||12));
  labels.forEach((lb,i)=>{if(i%step===0||i===labels.length-1)g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${esc(lb)}</text>`});
  series.forEach(s=>{const pts=s.values.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);if(!pts.length)return;const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    if(s.fill)g+=`<path d="${d} L${pts[pts.length-1][0]} ${Y(Math.max(mn,0))} L${pts[0][0]} ${Y(Math.max(mn,0))}Z" fill="${s.color}" opacity=".12"/>`;
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="6 5"':''}/>`;
    if(pts.length<=24)pts.forEach((p,i)=>{g+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="var(--surface)" stroke="${s.color}" stroke-width="2"/>`})});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
const legend=items=>`<div class="legend">${items.map(([c,l])=>`<span><i style="background:${c}"></i>${esc(l)}</span>`).join('')}</div>`;

/* ---------- Penny Garden (signature) ---------- */
function gardenSVG(goals,sunny=true){
  const W=720,H=230;const gs=goals.slice(0,7);const n=Math.max(gs.length,1);
  let s=`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sunny?'#CFE8F5':'#C9CED6'}"/><stop offset="1" stop-color="${sunny?'#F3F8EC':'#E6E8EA'}"/></linearGradient></defs>
  <rect width="${W}" height="${H}" fill="url(#sky)"/>`;
  if(sunny)s+=`<g transform="translate(650 48)"><circle r="24" fill="#F6C945"/>${Array.from({length:8},(_,i)=>`<line x1="0" y1="-32" x2="0" y2="-40" stroke="#F6C945" stroke-width="3" stroke-linecap="round" transform="rotate(${i*45})"/>`).join('')}</g>`;
  else s+=`<g transform="translate(640 50)" fill="#fff"><circle cx="-18" cy="6" r="16"/><circle cx="4" cy="-4" r="22"/><circle cx="26" cy="8" r="15"/><rect x="-34" y="6" width="74" height="18" rx="9"/></g>`;
  s+=`<g fill="#fff" opacity=".8"><ellipse cx="120" cy="40" rx="34" ry="10"/><ellipse cx="150" cy="34" rx="22" ry="12"/><ellipse cx="420" cy="30" rx="28" ry="8"/></g>`;
  s+=`<path d="M0 182 Q180 168 360 180 T720 176 V230 H0Z" fill="#8BC07A"/><path d="M0 196 Q200 186 380 196 T720 192 V230 H0Z" fill="#6FA862"/>`;
  if(!gs.length){s+=`<text x="${W/2}" y="120" text-anchor="middle" style="font:600 15px var(--sans);fill:#4b5b52">Add a savings goal to plant your first seed 🌱</text>`;return `<svg class="garden" viewBox="0 0 ${W} ${H}">${s}</svg>`}
  gs.forEach((g,i)=>{
    const p=clamp(goalSaved(g)/(+g.target||1),0,1);const x=60+(W-160)*(n===1?.5:i/(n-1));const base=190;const hgt=18+p*112;const top=base-hgt;const col=g.color||'#E8735A';
    s+=`<g><ellipse cx="${x}" cy="${base+2}" rx="22" ry="6" fill="#5C8F4F"/><path d="M${x} ${base} C ${x-4} ${base-hgt*.4}, ${x+4} ${base-hgt*.7}, ${x} ${top}" stroke="#3E7D45" stroke-width="4" fill="none" stroke-linecap="round"/>`;
    const leaves=Math.round(p*5);for(let k=0;k<leaves;k++){const ly=base-14-(hgt-24)*(k+1)/(leaves+1);const dir=k%2?1:-1;s+=`<path d="M${x} ${ly} q ${dir*16} -10 ${dir*24} -2 q ${-dir*10} 10 ${-dir*24} 2z" fill="#5BAE5E"/>`}
    if(p>=1){for(let k=0;k<6;k++)s+=`<ellipse cx="${x}" cy="${top-11}" rx="7" ry="13" fill="${col}" transform="rotate(${k*60} ${x} ${top})"/>`;s+=`<circle cx="${x}" cy="${top}" r="7" fill="#F6C945"/>`}
    else if(p>=.6){s+=`<path d="M${x} ${top+2} q -9 -10 0 -22 q 9 12 0 22z" fill="${col}"/>`}
    else s+=`<circle cx="${x}" cy="${top}" r="4.5" fill="#5BAE5E"/>`;
    s+=`<text x="${x}" y="${222}" text-anchor="middle" style="font:700 15px var(--sans);fill:#25412b">${esc(g.emoji||'🌱')} ${Math.round(p*100)}%</text></g>`;
  });
  return `<svg class="garden" viewBox="0 0 ${W} ${H}" role="img" aria-label="Savings garden">${s}</svg>`;
}

function applyTheme(){document.documentElement.dataset.theme=S.settings.theme||'garden';document.documentElement.dataset.dark=!!S.settings.dark;const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()}
function go(p){if(p==='more'){moreSheet();return}ui.page=p;closeModal();render();window.scrollTo(0,0);try{history.replaceState(null,'','#'+p)}catch(e){}}

  applyTheme();
  $('#side').innerHTML=`<div class="brand">${LOGO}<div><b>Penny Garden</b><small>Budget Planner</small></div></div>`+PAGES.map(p=>p[0]==='sep'?'<div class="nav-sep"></div>':`<button class="nav-btn ${ui.page===p[0]?'on':''}" data-a="go" data-p="${p[0]}">${ico(p[2])}${p[1]}</button>`).join('')+`<div class="side-foot">${S.demo?'<span class="pill y">Demo content</span><br><br>':''}Saved in this browser · <a href="#" data-a="go" data-p="settings">Back up</a></div>`;

  if(ui.page==='reports')per=`<div class="period"><button class="ibtn" data-a="yr" data-d="-1">${ico('left')}</button><span>${ui.year}</span><button class="ibtn" data-a="yr" data-d="1">${ico('right')}</button></div>`;
  $('#top').innerHTML=`<h1><span class="full">${P?P[1]:''}</span><span class="show-s">${SHORT[ui.page]||(P?P[1]:'')}</span></h1>${per}<button class="ibtn hide-s" data-a="dark" title="Dark mode" aria-label="Toggle dark mode">${ico(S.settings.dark?'sun':'moon')}</button><button class="ibtn hide-m" data-a="print" title="Print or save as PDF" aria-label="Print">${ico('print')}</button>`;
  const fn={dash:pDash,tx:pTx,budget:pBudget,bills:pBills,savings:pSavings,debt:pDebt,cal:pCal,nw:pNW,reports:pReports,tools:pTools,settings:pSettings,help:pHelp}[ui.page]||pDash;
  $('#page').innerHTML=`<div class="print-head">${LOGO}<b>Penny Garden · ${P?P[1]:''}</b><span>${ui.page==='reports'?ui.year:MONTH_PAGES.includes(ui.page)||ui.page==='budget'?monthLong(ui.ym):''} · printed ${niceDateY(todayISO())}</span></div>`+fn();
  $('#fab').style.display=['settings','help'].includes(ui.page)?'none':'';
  afterRender();
}
function afterRender(){ // inline input bindings
  $$('[data-bud]').forEach(el=>el.addEventListener('change',()=>{const c=cat(el.dataset.bud);const v=Math.max(0,parseFloat(el.value)||0);if(S.settings.mode==='biweekly')c.pbudget=v;else c.budget=v;save();render()}));
  $$('[data-nwv]').forEach(el=>el.addEventListener('change',()=>{const a=S.accounts.find(x=>x.id===el.dataset.nwv);a.vals[ui.ym]=parseFloat(el.value)||0;save();render()}));
  const q=$('#txq');if(q){q.addEventListener('input',()=>{ui.q=q.value;const pos=q.selectionStart;render();const n=$('#txq');n.focus();n.setSelectionRange(pos,pos)})}
  $$('[data-filter]').forEach(el=>el.addEventListener('change',()=>{ui[el.dataset.filter]=el.type==='checkbox'?el.checked:el.value;render()}));
  $$('[data-setting]').forEach(el=>el.addEventListener('change',()=>{const k=el.dataset.setting;S.settings[k]=el.type==='checkbox'?el.checked:(el.type==='number'?parseFloat(el.value)||0:el.value);if(k==='currency')_nf={};if(k==='payday')ui.cyc=cycleOf(todayISO());save();render()}));
  $$('[data-member]').forEach(el=>el.addEventListener('change',()=>{const i=+el.dataset.member;const old=S.settings.members[i];const nv=el.value.trim()||('Person '+(i+1));S.settings.members[i]=nv;S.tx.forEach(t=>{if(t.member===old)t.member=nv});S.incomePlan.forEach(p=>{if(p.member===old)p.member=nv});save();render()}));
  const aff=$('#afford');if(aff){const run=()=>{$('#affordOut').innerHTML=affordVerdict(parseFloat($('#affAmt').value)||0,$('#affCat').value,$('#affKind').value)};aff.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',run));run()}
  const ex=$('#extraPay');if(ex)ex.addEventListener('change',()=>{S.settings.extra=Math.max(0,parseFloat(ex.value)||0);save();render()});
}

function moreSheet(){

/* ---------- helpers for pages ---------- */
function upcoming(days=14){
  const t=todayISO(),end=addDays(t,days);const out=[];
  [ymOf(t),ymOf(end)].filter((v,i,a)=>a.indexOf(v)===i).forEach(ym=>S.bills.forEach(b=>{const d=billDueIn(b,ym);if(d&&d>=t&&d<=end)out.push({kind:'bill',date:d,name:b.name,amount:b.amount,paid:billPaid(b,ym),emoji:cat(b.cat).emoji,auto:b.autopay})}));
  S.subs.forEach(s=>{if(s.renew>=t&&s.renew<=end)out.push({kind:'sub',date:s.renew,name:s.name,amount:s.amount,paid:false,emoji:s.emoji||'🔁',using:s.using})});
  return out.sort((a,b)=>a.date<b.date?-1:1);
}
function overdueBills(ym){const t=todayISO();return S.bills.filter(b=>{const d=billDueIn(b,ym);return d&&d<t&&!billPaid(b,ym)})}
function simulate(debts,extra,method){
  let ds=debts.filter(d=>d.balance>0).map(d=>({id:d.id,bal:+d.balance,apr:+d.apr||0,min:+d.min||0}));
  const budget=sum(ds,d=>d.min)+(+extra||0);let m=0,interest=0;const series=[sum(ds,d=>d.bal)];const pay={};
  while(ds.some(d=>d.bal>0.005)&&m<600){m++;
    ds.forEach(d=>{if(d.bal>0){const i=d.bal*d.apr/1200;d.bal+=i;interest+=i}});
    let pool=budget;
    ds.forEach(d=>{if(d.bal>0){const p=Math.min(d.min,d.bal,pool);d.bal-=p;pool-=p}});
    const order=ds.filter(d=>d.bal>0.005).sort(method==='snowball'?(a,b)=>a.bal-b.bal:(a,b)=>b.apr-a.apr||a.bal-b.bal);
    for(const d of order){if(pool<=0)break;const p=Math.min(pool,d.bal);d.bal-=p;pool-=p}
    ds.forEach(d=>{if(d.bal<=0.005&&!pay[d.id]){pay[d.id]=m;d.bal=0}});
    series.push(sum(ds,d=>d.bal));
  }
  return {months:m,interest,series,pay,never:m>=600};
}
const monthsLabel=n=>{const y=Math.floor(n/12),m=n%12;return (y?y+' yr'+(y>1?'s':'')+' ':'')+(m||!y?m+' mo':'')};
function debtFree(){const r=simulate(S.debts,S.settings.extra||0,ui.method||S.settings.method||'avalanche');return r}
function insights(ym){
  const out=[];const st=monthStats(ym),pv=monthStats(ymAdd(ym,-1));
  const over=expCats().filter(c=>(c.group==='needs'||c.group==='wants')&&c.budget>0&&(st.byCat[c.id]||0)>c.budget);
  over.slice(0,2).forEach(c=>out.push(['⚠️',`<b>${esc(c.name)}</b> is ${m0((st.byCat[c.id]||0)-c.budget)} over budget this month.`]));
  const ch=expCats().filter(c=>c.group==='wants'||c.group==='needs').map(c=>{const a=st.byCat[c.id]||0,b=pv.byCat[c.id]||0;return {c,a,b,p:b?(a-b)/b:0}}).filter(x=>x.b>30&&x.a>0&&Math.abs(x.a-x.b)>25&&Math.abs(x.p)>=.2&&(ym!==curYM()||x.p>0)).sort((x,y)=>Math.abs(y.a-y.b)-Math.abs(x.a-x.b));
  ch.slice(0,2).forEach(x=>out.push([x.p>0?'📈':'📉',`You spent <b>${Math.round(Math.abs(x.p)*100)}% ${x.p>0?'more':'less'}</b> on ${esc(x.c.name)} than last month (${m0(x.a)} vs ${m0(x.b)}).`]));
  if(st.inc>0){const rate=(st.saved)/st.inc;out.push([rate>=.15?'🌱':'🪴',`You saved <b>${Math.round(rate*100)}%</b> of your income this month${rate>=.15?' — lovely work!':'. Even a little more each month helps your garden grow.'}`])}
  const unused=S.subs.filter(s=>!s.using);if(unused.length){const y=sum(unused,s=>s.cycle==='yearly'?s.amount:s.amount*12);out.push(['✂️',`${unused.length} subscription${unused.length>1?'s are':' is'} marked "not using". Cancelling could save <b>${m0(y)} a year</b>.`])}
  S.goals.filter(g=>goalSaved(g)<g.target).slice(0,3).forEach(g=>{const last3=[0,1,2].map(i=>sum(S.tx.filter(t=>t.goalId===g.id&&t.date.slice(0,7)===ymAdd(curYM(),-i)),t=>t.amount));const avg=sum(last3)/3;if(avg>0){const left=g.target-goalSaved(g);const n=Math.ceil(left/avg);out.push(['🎯',`At this pace, <b>${esc(g.name)}</b> is fully funded by <b>${monthLong(ymAdd(curYM(),n))}</b>.`])}});
  const lta=planIncome()-totalBudget();if(S.settings.mode==='monthly'&&lta>1&&S.incomePlan.length)out.push(['💡',`${m0(lta)} of your planned income doesn't have a job yet. Give it one on the Budget page.`]);
  const ns=S.nospend.filter(d=>d.slice(0,7)===ym).length;if(ns)out.push(['🌿',`${ns} no-spend day${ns>1?'s':''} this month. Each one is a little win!`]);
  return out.slice(0,6);
}
const greet=()=>{const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'};

/* ---------- DASHBOARD ---------- */
function pDash(){
  const ym=ui.ym,st=monthStats(ym);const spendB=sum(expCats().filter(c=>c.group==='needs'||c.group==='wants'),c=>c.budget);const used=spendB?st.spend/spendB:0;
  const t=todayISO();let h='';
  if(S.demo)h+=`<div class="banner"><span style="font-size:22px">🌼</span><div class="t"><b>You're exploring demo content.</b> <span class="muted">Click around and try everything. When you're ready, erase it in one click.</span></div><button class="btn sm pri" data-a="eraseDemo">Erase demo & start fresh</button></div>`;

   <div class="card kpi hero c3"><div class="ico">🌿</div><div class="lab">Left this month</div><div class="val">${m0(st.left)}</div><div class="small muted">after spending, saving & debt</div></div>
   <div class="card kpi c3"><div class="ico">💰</div><div class="lab">Income</div><div class="val good">${m0(st.inc)}</div><div class="small muted">${S.incomePlan.length?'of '+m0(planIncome())+' planned':'received this month'}</div></div>
   <div class="card kpi c3"><div class="ico">🛒</div><div class="lab">Spending</div><div class="val">${m0(st.spend)}</div><div class="bar" style="margin-top:6px"><i style="width:${clamp(used*100,0,100)}%;background:${used>1?'var(--bad)':used>.85?'var(--warn)':'var(--pri)'}"></i></div><div class="small muted" style="margin-top:4px">${Math.round(used*100)}% of ${m0(spendB)} budget</div></div>
   <div class="card kpi c3"><div class="ico">🌱</div><div class="lab">Saved & debt paid</div><div class="val">${m0(st.saved+st.debt)}</div><div class="small muted">${m0(st.saved)} saved · ${m0(st.debt)} to debt</div></div>
  </div><div style="height:18px"></div><div class="grid">`;
  // budget vs actual
  const rows=expCats().filter(c=>(c.group==='needs'||c.group==='wants')&&(c.budget>0||st.byCat[c.id])).sort((a,b)=>(st.byCat[b.id]||0)-(st.byCat[a.id]||0)).slice(0,8);
  h+=`<div class="card c7"><div class="card-h"><h3>Budget vs actual</h3><button class="btn sm ghost" data-a="go" data-p="budget">See all →</button></div>${rows.map(c=>{const s=st.byCat[c.id]||0,p=c.budget?s/c.budget:1;return `<div style="margin-bottom:11px"><div class="row" style="gap:8px;margin-bottom:4px;flex-wrap:nowrap"><span>${c.emoji}</span><b style="flex:1;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.name)}</b><span class="small num"><b class="${p>1?'bad':''}">${m0(s)}</b> <span class="muted">/ ${m0(c.budget)}</span></span></div><div class="bar"><i style="width:${clamp(p*100,0,100)}%;background:${p>1?'var(--bad)':c.color}"></i></div></div>`}).join('')||'<div class="empty"><span class="e">🧾</span>No spending yet this month.</div>'}</div>`;
  const dd=expCats().filter(c=>c.group==='needs'||c.group==='wants').map(c=>({label:c.name,value:st.byCat[c.id]||0,color:c.color})).sort((a,b)=>b.value-a.value);
  h+=`<div class="card c5"><div class="card-h"><h3>Where it went</h3></div>${donutBlock(dd,m0(st.spend),'spent')}</div>`;

  // debt free
  const r=S.debts.length?debtFree():null;const tot=sum(S.debts,d=>d.balance),orig=sum(S.debts,d=>d.original||d.balance);
  h+=`<div class="card c4"><div class="card-h"><h3>🏁 Debt-free countdown</h3></div>${r?(r.never?`<div class="empty"><span class="e">⚠️</span>Your payments don't cover the interest yet. Add an extra payment on Debt Payoff.</div>`:`<div style="text-align:center;padding:4px 0 10px"><div class="muted small">You could be debt-free in</div><div style="font-family:var(--serif);font-size:34px;font-weight:700;color:var(--pri)">${r.months===0?'Done! 🎉':monthLong(ymAdd(curYM(),r.months))}</div><div class="muted small">${r.months} payments to go · ${m0(tot)} left</div></div><div class="bar thick"><i style="width:${orig?clamp((1-tot/orig)*100,0,100):0}%;background:linear-gradient(90deg,var(--pri),var(--pri2))"></i></div><div class="row small muted" style="margin-top:6px"><span>${Math.round(orig?(1-tot/orig)*100:0)}% paid off</span><span class="sp"></span><a href="#" data-a="go" data-p="debt">Plan →</a></div>`):'<div class="empty"><span class="e">🕊️</span>No debts added. Add any loans or cards on Debt Payoff.</div>'}</div>`;

  // recent + no spend
  const rec=txMonth(ym).sort((a,b)=>a.date<b.date?1:-1).slice(0,7);
  h+=`<div class="card c8"><div class="card-h"><h3>Recent transactions</h3><button class="btn sm" data-a="addTx">${ico('plus')}Add</button><button class="btn sm ghost" data-a="go" data-p="tx">All →</button></div><div class="list">${rec.map(txRow).join('')||'<div class="empty"><span class="e">🧾</span>No transactions this month yet. Tap + to add one.</div>'}</div></div>`;
  const nsm=S.nospend.filter(d=>d.slice(0,7)===ym).length;const sk=nsStreak();
  const subM=sum(S.subs,s=>s.cycle==='yearly'?s.amount/12:s.amount);

function pDebt(){
  const method=ui.method||S.settings.method||'avalanche';const extra=+S.settings.extra||0;
  const av=simulate(S.debts,extra,'avalanche'),sn=simulate(S.debts,extra,'snowball'),r=method==='snowball'?sn:av;
  const tot=sum(S.debts,d=>d.balance),orig=sum(S.debts,d=>d.original||d.balance),mins=sum(S.debts,d=>d.min);
  let h=`<div class="grid kpis"><div class="card kpi c3"><div class="lab">Total debt</div><div class="val">${m0(tot)}</div><div class="small muted">${S.debts.length} debts</div></div><div class="card kpi c3"><div class="lab">Paid off so far</div><div class="val good">${m0(orig-tot)}</div><div class="bar"><i style="width:${orig?clamp((1-tot/orig)*100,0,100):0}%"></i></div></div><div class="card kpi c3"><div class="lab">Monthly payment</div><div class="val">${m0(mins+extra)}</div><div class="small muted">${m0(mins)} minimums + ${m0(extra)} extra</div></div><div class="card kpi hero c3"><div class="ico">🏁</div><div class="lab">Debt-free date</div><div class="val">${!S.debts.length?'—':r.never?'Not yet':r.months===0?'Today!':monthShort(ymAdd(curYM(),r.months))+' '+ymAdd(curYM(),r.months).slice(0,4)}</div><div class="small">${r.never?'payments too low':S.debts.length?monthsLabel(r.months)+' to go':''}</div></div></div><div style="height:18px"></div>`;
  if(!S.debts.length)return h+`<div class="card"><div class="empty"><span class="e">🕊️</span>Add credit cards, loans or any money you owe, and see exactly when you'll be debt-free.<br><br><button class="btn pri" data-a="debtModal">${ico('plus')}Add a debt</button></div></div>`;
  const box=(k,res,lab,desc)=>`<div class="goal" style="${method===k?'border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)':''};cursor:pointer" data-a="method" data-v="${k}"><div class="row"><b style="font-size:16px">${lab}</b>${(k==='avalanche'?av.interest<=sn.interest:sn.interest<av.interest)?'<span class="pill g">saves most</span>':''}${method===k?'<span class="pill">selected</span>':''}</div><div class="tiny muted">${desc}</div><div class="row" style="gap:18px"><div><div class="tiny muted">Debt-free</div><b>${res.never?'—':monthShort(ymAdd(curYM(),res.months))+' '+ymAdd(curYM(),res.months).slice(0,4)}</b></div><div><div class="tiny muted">Interest</div><b>${res.never?'—':m0(res.interest)}</b></div><div><div class="tiny muted">Time</div><b>${res.never?'—':monthsLabel(res.months)}</b></div></div></div>`;
  const N=Math.max(av.series.length,sn.series.length);const lab=Array.from({length:N},(_,i)=>i%12===0?ymAdd(curYM(),i).slice(0,4):monthShort(ymAdd(curYM(),i)));
  h+=`<div class="grid"><div class="card c5"><div class="card-h"><h3>⚖️ Snowball vs Avalanche</h3></div><div class="field"><label>Extra payment each month (on top of minimums)</label><input id="extraPay" class="inp" type="number" min="0" step="10" value="${extra}"></div><div style="display:grid;gap:10px">${box('avalanche',av,'🏔️ Avalanche','Pay the highest interest rate first. Saves the most money.')}${box('snowball',sn,'⛄ Snowball','Pay the smallest balance first. Quick wins keep you motivated.')}</div>${av.interest<sn.interest-1?`<p class="small" style="margin:10px 0 0">Avalanche saves you <b class="good">${m0(sn.interest-av.interest)}</b> in interest.</p>`:''}</div>

function pCal(){

  const nsm=[...ns].filter(d=>d.slice(0,7)===ym).length;let best=0,run=0;for(let i=1;i<=n;i++){if(ns.has(ym+'-'+pad(i))){run++;best=Math.max(best,run)}else run=0}

function affordVerdict(a,cid,kind){
  if(!a)return `<div class="verdict maybe"><div class="big">Type a price</div><div class="small">and I'll check it against your budget</div></div>`;
  const ym=curYM(),st=monthStats(ym),c=cat(cid),t=todayISO();const catLeft=(c.budget||0)-(st.byCat[cid]||0);
  const unpaid=sum(S.bills.filter(b=>{const d=billDueIn(b,ym);return d&&d>=t&&!billPaid(b,ym)}),b=>b.amount);
  const planLeft=(S.incomePlan.length?Math.max(st.inc,planIncome()):st.inc)-st.out-unpaid;
  const reasons=[];reasons.push(`${esc(c.name)} has <b>${m0(catLeft)}</b> left this month.`);reasons.push(`After ${m0(unpaid)} of bills still to pay, you have about <b>${m0(planLeft)}</b> free.`);
  let cls,big;
  if(a<=catLeft&&a<=planLeft){cls='yes';big='Yes, it fits! 🌿'}
  else if(a<=planLeft){cls='maybe';big='Maybe 🤔';reasons.push(`It would put ${esc(c.name)} <b>${m0(a-catLeft)}</b> over budget. Move money from another category first.`)}
  else{cls='no';big='Not this month 🌧️';reasons.push(`You'd be short by <b>${m0(a-planLeft)}</b>.`);const g=S.goals.find(x=>goalSaved(x)<x.target);if(kind==='want')reasons.push(`Idea: start a sinking fund for it. Saving ${m0(a/3)} a month gets you there in 3 months.`)}
  if(kind==='want'&&cls!=='no')reasons.push('Wants tip: wait 48 hours. If you still want it, enjoy it guilt-free!');
  return `<div class="verdict ${cls}"><div class="big">${big}</div></div><div style="margin-top:12px">${reasons.map(r=>`<div class="insight"><span class="i">•</span><span>${r}</span></div>`).join('')}</div>`;
}

  h+=`<div class="card c6"><div class="card-h"><h3>⚖️ 50/30/20 check</h3><span class="muted small">${monthLong(ym)}</span></div><p class="small muted" style="margin-top:0">A popular guideline: about 50% of income on needs, 30% on wants and 20% on savings and debt.</p>${parts.map(([n,v,tg,col])=>{const p=inc?v/inc:0;return `<div style="margin-bottom:14px"><div class="row small" style="margin-bottom:4px"><b style="flex:1">${n}</b><span>${Math.round(p*100)}% <span class="muted">· aim ${tg*100}%</span></span><span class="pill ${n==='Savings & debt'?(p>=tg?'g':'y'):(p<=tg?'g':'y')}">${n==='Savings & debt'?(p>=tg?'on track':'a bit low'):(p<=tg?'on track':'a bit high')}</span></div><div class="bar thick" style="position:relative"><i style="width:${clamp(p*100,0,100)}%;background:${col}"></i><span style="position:absolute;left:${tg*100}%;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5"></span></div></div>`}).join('')}</div>`;
  // lean month
  const last6=Array.from({length:6},(_,i)=>ymAdd(ym,-(i+1))).reverse().map(m=>({m,s:monthStats(m)}));const incs=last6.map(x=>x.s.inc).filter(v=>v>0);
  const lo=incs.length?Math.min(...incs):0,avg=incs.length?sum(incs)/incs.length:0,avgOut=sum(last6,x=>x.s.spend)/6;const gap=Math.max(0,avgOut-lo);const buf=Math.max(gap*3,avgOut);
  h+=`<div class="card c6"><div class="card-h"><h3>🎲 Lean-month planner</h3><span class="muted small">for irregular income</span></div>${incs.length?`${barChart(last6.map(x=>monthShort(x.m)),[{name:'Income',color:'var(--pri)',values:last6.map(x=>x.s.inc)}],170)}<div class="list"><div class="li"><div class="em">📉</div><div class="mid"><b>Lowest month</b><span>build your basic budget on this</span></div><div class="amt">${m0(lo)}</div></div><div class="li"><div class="em">📊</div><div class="mid"><b>Average month</b><span>last 6 months</span></div><div class="amt">${m0(avg)}</div></div><div class="li"><div class="em">🛟</div><div class="mid"><b>Buffer to aim for</b><span>at least 1 month of everyday spending</span></div><div class="amt">${m0(buf)}</div></div></div><p class="small muted">In good months, put anything above ${m0(lo)} into your buffer or goals first. In lean months, use the buffer to top up.</p>`:'<div class="empty">Add a few months of income to see your lean-month plan.</div>'}</div>`;
  // household
  const mem=S.settings.members;const tx=txMonth(ym).filter(t=>t.type==='expense');const paid=mem.map(m=>sum(tx.filter(t=>t.member===m),t=>t.amount));const shared=sum(tx.filter(t=>t.member==='Shared'),t=>t.amount);
  let ratio=[.5,.5];if(S.settings.split==='income'){const i0=sum(txMonth(ym).filter(t=>t.type==='income'&&t.member===mem[0]),t=>t.amount),i1=sum(txMonth(ym).filter(t=>t.type==='income'&&t.member===mem[1]),t=>t.amount);if(i0+i1>0)ratio=[i0/(i0+i1),i1/(i0+i1)]}
  const tot=paid[0]+paid[1];const diff=paid[0]-tot*ratio[0];
  h+=`<div class="card c6"><div class="card-h"><h3>👫 Household split</h3><select class="inp sm" style="width:auto" data-setting="split"><option value="50" ${S.settings.split!=='income'?'selected':''}>Split 50/50</option><option value="income" ${S.settings.split==='income'?'selected':''}>Split by income</option></select></div><div class="grid" style="gap:10px">${mem.map((m,i)=>`<div style="grid-column:span 6;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px"><div class="small muted">${esc(m)} paid</div><div style="font-family:var(--serif);font-size:23px;font-weight:700">${m0(paid[i])}</div><div class="tiny muted">fair share ${Math.round(ratio[i]*100)}% = ${m0(tot*ratio[i])}</div></div>`).join('')}</div><div class="verdict ${Math.abs(diff)<1?'yes':'maybe'}" style="margin-top:12px;padding:14px"><div style="font-weight:700;font-size:16px">${Math.abs(diff)<1||!tot?'You\'re all square 🤝':`${esc(diff>0?mem[1]:mem[0])} owes ${esc(diff>0?mem[0]:mem[1])} ${money(Math.abs(diff))}`}</div></div><p class="tiny muted" style="margin:10px 0 0">Counts this month's spending paid by each person. Items marked "Shared" (paid from a joint account) aren't counted again: ${m0(shared)} this month. Rename people in Settings.</p></div></div>`;
  return h;
}

function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function exportJSON(){S.settings.lastBackup=todayISO();saveNow();download(`penny-garden-backup-${todayISO()}.json`,JSON.stringify(S,null,1),'application/json');toast('Backup downloaded 💾');render()}
function pickFile(accept,cb){const i=document.createElement('input');i.type='file';i.accept=accept;i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>cb(String(r.result),f.name);r.readAsText(f)};i.click()}
ACT.importJSON=()=>pickFile('.json,application/json',txt=>{try{const d=JSON.parse(txt);if(!d||!Array.isArray(d.cats)||!Array.isArray(d.tx))throw 0;if(!confirm('Replace everything in this planner with the backup?'))return;S=Object.assign(freshState(),d);S.settings=Object.assign(freshState().settings,d.settings);_nf={};saveNow();render();toast('Backup restored ✓')}catch(e){alert('That file doesn\'t look like a Penny Garden backup.')}});
const csvCell=v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
ACT.exportCSV=()=>{const rows=[['Date','Type','Category','Group','Amount','Note','Who']].concat(S.tx.slice().sort((a,b)=>a.date<b.date?-1:1).map(t=>{const c=cat(t.cat);return [t.date,t.type==='income'?'Income':'Expense',c.name,GROUPS[c.group]||'',t.amount.toFixed(2),t.note||'',t.member||'']}));download(`penny-garden-transactions-${todayISO()}.csv`,rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv');toast('CSV downloaded')};
function parseCSV(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else if(ch==='"')q=true;else if(ch===','||ch===';'&&!t.includes(',')){r.push(f);f=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(f);rows.push(r);r=[];f=''}else f+=ch}if(f||r.length){r.push(f);rows.push(r)}return rows.filter(x=>x.some(c=>c.trim()))}
function parseDate(s){s=s.trim();let m;if(m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);if(m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/)){let [_,a,b,y]=m;y=y.length===2?'20'+y:y;let mo=+a,d=+b;if(mo>12){mo=+b;d=+a}return y+'-'+pad(mo)+'-'+pad(d)}const d=new Date(s);return isNaN(d)?null:iso(d)}
ACT.importCSV=()=>pickFile('.csv,text/csv',txt=>{
  const rows=parseCSV(txt);if(rows.length<2){alert('No rows found in that CSV.');return}
  const hd=rows[0].map(h=>h.toLowerCase().trim());const ix=k=>hd.findIndex(h=>k.some(x=>h.includes(x)));
  const iD=ix(['date']),iA=ix(['amount','value','sum']),iN=ix(['description','note','memo','payee','details','name','narrative']),iC=ix(['category']),iT=ix(['type']),iDb=ix(['debit','withdraw','paid out','money out']),iCr=ix(['credit','deposit','paid in','money in']),iW=ix(['who','member']);
  if(iD<0||(iA<0&&iDb<0&&iCr<0)){alert('Your CSV needs at least a Date column and an Amount (or Debit/Credit) column.');return}
  const other=catByName('Other')||expCats()[0],oinc=catByName('Other income')||incCats()[0];const out=[];
  rows.slice(1).forEach(r=>{const date=parseDate(r[iD]||'');if(!date)return;let amt,type;const num=v=>parseFloat(String(v||'').replace(/[^0-9.\-]/g,''));
    if(iA>=0&&String(r[iA]||'').trim()){amt=num(r[iA]);type=amt<0?'expense':'income';if(iT>=0){const tv=(r[iT]||'').toLowerCase();if(/exp|debit|out|withdraw/.test(tv))type='expense';else if(/inc|credit|in|deposit/.test(tv))type='income'}}
    else{const d=num(r[iDb]),c=num(r[iCr]);if(d){amt=d;type='expense'}else if(c){amt=c;type='income'}}
    if(!amt||isNaN(amt))return;const cn=iC>=0?catByName((r[iC]||'').trim()):null;
    out.push({id:uid(),date,type,amount:r2(Math.abs(amt)),cat:cn&&cn.kind===type?cn.id:(type==='income'?oinc.id:other.id),note:iN>=0?(r[iN]||'').trim().slice(0,80):'',member:iW>=0&&r[iW]?r[iW].trim():S.settings.members[0]})});
  if(!out.length){alert('No transactions could be read from that CSV.');return}
  const ds=out.map(t=>t.date).sort();if(!confirm(`Found ${out.length} transactions from ${niceDateY(ds[0])} to ${niceDateY(ds[ds.length-1])}. Import them?`))return;
  S.tx.push(...out);save();render();toast(`Imported ${out.length} transactions. Tip: re-categorise "Other" items.`)});

const hashPin=p=>{let h=5381;const s='pg::'+p;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(36)};
ACT.setPin=()=>{const m=modal('Set a 4-digit PIN',`<div class="f2"><div class="field"><label>New PIN</label><input class="inp" name="a" inputmode="numeric" maxlength="4" type="password" autofocus></div><div class="field"><label>Type it again</label><input class="inp" name="b" inputmode="numeric" maxlength="4" type="password"></div></div><p class="tiny muted">If you forget your PIN, the only way back in is to erase the planner and import a backup. Keep a backup!</p>`,{save:m=>{const a=val(m,'a'),b=val(m,'b');if(!/^\d{4}$/.test(a)){toast('Use exactly 4 digits');return false}if(a!==b){toast("PINs don't match");return false}S.settings.pin=hashPin(a);saveNow();render();toast('PIN lock is on 🔒')}})};

function showLock(){const L=$('#lock');let entry='';const draw=()=>{L.innerHTML=`${LOGO}<h2 style="margin-top:4px">Penny Garden</h2><p class="muted" style="margin:0">Enter your PIN</p><div class="dots">${[0,1,2,3].map(i=>`<i class="${i<entry.length?'f':''}"></i>`).join('')}</div><div class="keypad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-k="${k}">${k}</button>`).join('')}</div><button class="btn ghost small" id="forgot">Forgot PIN?</button>`;
  L.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>press(b.dataset.k));L.querySelector('#forgot').onclick=()=>{if(confirm('Forgot your PIN? You can erase this planner and start again, then use "Import backup" to restore your data. Erase now?')){S=freshState();saveNow();L.classList.remove('on');showOnb()}}};
  const press=k=>{if(k==='⌫')entry=entry.slice(0,-1);else if(entry.length<4)entry+=k;draw();if(entry.length===4){if(hashPin(entry)===S.settings.pin){L.classList.remove('on');document.removeEventListener('keydown',kd)}else{const d=L.querySelector('.dots');d.classList.add('shake');setTimeout(()=>{entry='';draw()},400)}}};
  const kd=e=>{if(!L.classList.contains('on'))return;if(/^\d$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('⌫')};
  document.addEventListener('keydown',kd);L.classList.add('on');draw()}

    <div class="field" id="o_pdw" style="display:none"><label>A recent payday</label><input class="inp" type="date" id="o_pd" value="${s.payday}"></div>
    <div class="f2"><div class="field"><label>Monthly take-home income</label><input class="inp" id="o_inc" inputmode="decimal" placeholder="e.g. 4000"></div><div class="field"><label>Budgeting with someone? (their name)</label><input class="inp" id="o_p2" placeholder="optional"></div></div>
    <button class="btn pri" style="width:100%;padding:13px;margin-top:6px" id="o_go">Start my planner →</button></div></div>`;
    let mode='monthly';O.querySelectorAll('#o_mode button').forEach(b=>b.onclick=()=>{O.querySelectorAll('#o_mode button').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.v;O.querySelector('#o_pdw').style.display=mode==='biweekly'?'':'none'});
    O.querySelector('#o_go').onclick=()=>{const n=O.querySelector('#o_name').value.trim();Object.assign(S.settings,{name:n,currency:O.querySelector('#o_cur').value,mode,payday:O.querySelector('#o_pd').value||s.payday});S.settings.members=[n||'Me',O.querySelector('#o_p2').value.trim()||'Partner'];_nf={};const inc=parseFloat(O.querySelector('#o_inc').value)||0;if(inc)S.incomePlan=[{id:uid(),name:'Take-home pay',amount:inc,member:S.settings.members[0],irregular:false}];S.started=true;S.demo=false;saveNow();O.classList.remove('on');ui.ym=curYM();ui.cyc=cycleOf(todayISO());go('dash');toast('Your garden is ready 🌱 Tap + to add your first transaction')};}
  O.classList.add('on');O.scrollTop=0;
}

/* ---------- init ---------- */
function init(){
  load();
  const h=(location.hash||'').slice(1);if(PAGES.some(p=>p[0]===h))ui.page=h;
  ui.cyc=cycleOf(todayISO());
  $('#fab').innerHTML=ico('plus');$('#fab').onclick=()=>txModal(null);
  if(!S.started){render();showOnb();}else{rollSubs();save();render();if(S.settings.pin)showLock()}
  if(/^https?:/.test(location.protocol)&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  window.addEventListener('storage',e=>{if(e.key===KEY){load();render()}});
}
init();
